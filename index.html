<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn American Sign Language with short lessons, flashcards, a word of the day and practice games.">
<meta name="theme-color" content="#2350E6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%A4%9F%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>SignSpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono:wght@400;500&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: a study desk. Nav | lesson path | "today" column on wide screens;
   one column with a bottom tab bar on phones. Every hand sits on a buff
   "stage" (a nod to Gallaudet University's blue and buff). */
:root {
  --bg: #F3F6FC;
  --surface: #FFFFFF;
  --surface-2: #E9EEF8;
  --line: #D5DDED;
  --ink: #131C33;
  --muted: #56617E;
  --brand: #2350E6;
  --brand-ink: #FFFFFF;
  --brand-shade: #1838A8;
  --brand-soft: #E1E8FF;
  --stage: #F4E4BE;
  --sun: #E39A00;
  --sun-soft: #FFF1CC;
  --flame: #EE5D0B;
  --flame-soft: #FFE6D6;
  --teal: #0B7F72;
  --good: #0F7A46;
  --good-strong: #13A05A;
  --good-soft: #DDF5E7;
  --good-btn: #108A4C;
  --good-btn-ink: #FFFFFF;
  --good-shade: #0B6338;
  --bad: #C42F38;
  --bad-soft: #FDE4E5;
  --bad-btn: #C9303A;
  --bad-btn-ink: #FFFFFF;
  --bad-shade: #9E1F28;
  --motion: #E0461F;
  --fig: #DAE2F2;
  --fig-line: #7D89A8;
  --fig-hair: #3E4A69;
  --scrim: rgb(8 12 24 / 0.55);
  --hand: #FFCF5A;
  --hand-2: #F2B93B;
  --hand-line: #8A5A0E;
  --hand-nail: #FFF0C2;
  --shadow: 0 1px 2px rgb(19 28 51 / 0.06), 0 12px 28px -18px rgb(19 28 51 / 0.32);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-gloss: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222;
    --surface: #141C31;
    --surface-2: #1C2643;
    --line: #2A3658;
    --ink: #EDF1FF;
    --muted: #A3AEC9;
    --brand: #7C97FF;
    --brand-ink: #0C1222;
    --brand-shade: #4F69D6;
    --brand-soft: #1F2B57;
    --stage: #3B3527;
    --sun: #FFC23D;
    --sun-soft: #3A2D0B;
    --flame: #FF8A3D;
    --flame-soft: #3B2112;
    --teal: #3CC8B4;
    --good: #4AD58A;
    --good-strong: #2FBF72;
    --good-soft: #0F2E1F;
    --good-btn: #3FCB80;
    --good-btn-ink: #0C1222;
    --good-shade: #1E8A52;
    --bad: #FF7A80;
    --bad-soft: #3A1619;
    --bad-btn: #FF6B72;
    --bad-btn-ink: #0C1222;
    --bad-shade: #B23A41;
    --motion: #FF7A52;
    --fig: #27324F;
    --fig-line: #8792B0;
    --fig-hair: #B4BED6;
    --scrim: rgb(0 0 0 / 0.62);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 28px -18px rgb(0 0 0 / 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222;
  --surface: #141C31;
  --surface-2: #1C2643;
  --line: #2A3658;
  --ink: #EDF1FF;
  --muted: #A3AEC9;
  --brand: #7C97FF;
  --brand-ink: #0C1222;
  --brand-shade: #4F69D6;
  --brand-soft: #1F2B57;
  --stage: #3B3527;
  --sun: #FFC23D;
  --sun-soft: #3A2D0B;
  --flame: #FF8A3D;
  --flame-soft: #3B2112;
  --teal: #3CC8B4;
  --good: #4AD58A;
  --good-strong: #2FBF72;
  --good-soft: #0F2E1F;
  --good-btn: #3FCB80;
  --good-btn-ink: #0C1222;
  --good-shade: #1E8A52;
  --bad: #FF7A80;
  --bad-soft: #3A1619;
  --bad-btn: #FF6B72;
  --bad-btn-ink: #0C1222;
  --bad-shade: #B23A41;
  --motion: #FF7A52;
  --fig: #27324F;
  --fig-line: #8792B0;
  --fig-hair: #B4BED6;
  --scrim: rgb(0 0 0 / 0.62);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 28px -18px rgb(0 0 0 / 0.8);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
html.player-open, html.player-open body { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 1.35rem + 1.4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.12rem; font-weight: 750; }
p, ul, ol, dl, figure { margin: 0; }
a { color: var(--brand); }
img, svg { max-width: 100%; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important; float: none !important; }
.muted { color: var(--muted); }
.fine { font-size: 0.8rem; color: var(--muted); }
.gloss { font-family: var(--f-gloss); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.hl { color: var(--brand); }
.eyebrow, .ex-kicker, .unit-kicker, .pop-kicker {
  display: flex; align-items: center; gap: 6px;
  font: 500 0.74rem/1.2 var(--f-gloss); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.skip { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

/* ---------- Buttons and form controls ---------- */
.btn {
  --b: var(--brand); --b-ink: var(--brand-ink); --b-shade: var(--brand-shade);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 12px 20px; border: 0; border-radius: var(--r-md);
  background: var(--b); color: var(--b-ink); text-decoration: none;
  font: 700 1rem/1.1 var(--f-body); letter-spacing: 0.01em; cursor: pointer;
  box-shadow: 0 4px 0 var(--b-shade);
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--b-shade); }
.btn:disabled { --b: var(--surface-2); --b-ink: var(--muted); --b-shade: var(--line); cursor: not-allowed; }
.btn-quiet { --b: var(--surface); --b-ink: var(--ink); --b-shade: var(--line); outline: 2px solid var(--line); outline-offset: -2px; }
.btn-quiet:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.btn-good { --b: var(--good-btn); --b-ink: var(--good-btn-ink); --b-shade: var(--good-shade); }
.btn-bad { --b: var(--bad-btn); --b-ink: var(--bad-btn-ink); --b-shade: var(--bad-shade); }
.btn-sm { min-height: 40px; padding: 8px 14px; font-size: 0.92rem; box-shadow: 0 3px 0 var(--b-shade); }
.btn-block { width: 100%; }
.btn-wide { min-width: min(320px, 100%); }
.icon-btn {
  display: grid; place-items: center; width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
input[type="text"], input[type="search"], select, textarea {
  width: 100%; min-height: 48px; padding: 12px 14px;
  border: 2px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink); font: 500 1rem var(--f-body);
}
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent);
}
textarea { font: 500 0.8rem/1.4 var(--f-gloss); resize: vertical; }
input[type="range"] { accent-color: var(--brand); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
.seg legend { float: left; width: 100%; margin-bottom: 6px; padding: 0; font-weight: 700; font-size: 0.92rem; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 9px 14px;
  border: 2px solid var(--line); border-radius: 999px; background: var(--surface);
  font-weight: 600; font-size: 0.92rem; cursor: pointer;
}
.seg label small { font: 500 0.72rem var(--f-gloss); color: var(--muted); }
.seg input:checked + label { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.seg input:checked + label small { color: inherit; }
.seg input:focus-visible + label { outline: 3px solid var(--brand); outline-offset: 2px; }
.seg-sm label { padding: 7px 12px; font-size: 0.86rem; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
  border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
  font: 600 0.9rem var(--f-body); cursor: pointer;
}
.chip:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.chip-n { font: 500 0.75rem var(--f-gloss); color: var(--muted); }
.chip-static { padding: 4px 10px; font-size: 0.85rem; cursor: default; }
.chip-static:hover { border-color: var(--line); }

.card { padding: 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.row-center { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* ---------- App shell ---------- */
.app {
  display: grid; min-height: 100%;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "top" "view";
  grid-template-rows: auto 1fr;
  padding-inline: 16px;
}
.topbar { grid-area: top; }
.view { grid-area: view; }
.sidebar { grid-area: side; display: none; }
.rail { grid-area: rail; display: none; }

.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 40px; height: 44px; flex: none; overflow: hidden; border-radius: 12px; background: var(--stage); }
.brand-mark .hand { width: 34px; }
.brand-name { font: 800 1.35rem/1 var(--f-display); letter-spacing: -0.02em; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-inline: -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.top-stats { display: flex; align-items: center; gap: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 800 1rem var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.pill-flame.lit { color: var(--flame); }
.pill-xp { color: var(--sun); }
.pill-goal .ring { display: block; }

.view { min-width: 0; padding-block: 18px 112px; outline: none; }
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tab-link {
  display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px;
  color: var(--muted); font-size: 0.68rem; font-weight: 600; text-decoration: none;
}
.tab-link[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }

.side-nav { display: grid; gap: 4px; }
.side-link {
  display: flex; align-items: center; gap: 14px; padding: 11px 14px;
  border: 2px solid transparent; border-radius: var(--r-md);
  color: var(--muted); font-weight: 700; text-decoration: none;
}
.side-link:hover { background: var(--surface-2); color: var(--ink); }
.side-link[aria-current="page"] { color: var(--brand); background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 35%, transparent); }

@media (min-width: 760px) {
  .app {
    grid-template-columns: 210px minmax(0, 1fr);
    grid-template-areas: "side top" "side view";
    column-gap: 32px;
  }
  .sidebar {
    display: flex; flex-direction: column; gap: 26px;
    position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
    height: 100vh; height: 100dvh; padding-block: 22px;
  }
  .topbar { margin-inline: 0; padding-inline: 0; justify-content: flex-end; border-bottom: 0; background: transparent; backdrop-filter: none; position: static; }
  .topbar .brand { display: none; }
  .tabbar { display: none; }
  .view { padding-block: 8px 64px; }
}
@media (min-width: 1100px) {
  .app {
    grid-template-columns: 210px minmax(0, 1fr) 340px;
    grid-template-areas: "side view rail";
    grid-template-rows: 1fr;
  }
  .topbar { display: none; }
  .view { padding-block: 26px 64px; }
  .rail {
    display: flex; flex-direction: column; gap: 14px;
    position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
    max-height: 100vh; max-height: 100dvh; overflow-y: auto; padding-block: 26px;
  }
  .today-inline { display: none; }
}

.page { display: grid; align-content: start; gap: 22px; width: 100%; max-width: 760px; margin-inline: auto; }
.page-learn { max-width: 620px; }
.page-head { display: grid; gap: 6px; }
.page-head p { color: var(--muted); }

/* ---------- Hand drawings and body maps ---------- */
.stage { display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; overflow: hidden; border-radius: 50%; background: var(--stage); }
.stage .hand { width: 76%; height: auto; }
.stage-xs { width: 56px; }
.stage-sm { width: 88px; }
.stage-md { width: 156px; }
.stage-lg { width: 204px; }
.stage-blank { background: var(--surface-2); }
.hand { display: block; }
.flip .hand, .flip .body-map { transform: scaleX(-1); }
.flip .brand-mark .hand { transform: none; }

.hd-o { stroke: var(--hand-line); }
.hd-s { stroke: var(--hand); }
.hd-s2 { stroke: var(--hand-2); }
.hd-n { stroke: var(--hand-nail); }
.hd-nf { fill: var(--hand-nail); }
.hd-c { stroke: var(--hand-line); opacity: 0.45; }
.hd-pf { fill: var(--hand); stroke: var(--hand-line); }
.hd-cv { fill: var(--hand); }
.hd-mo { stroke: var(--motion); }
.hd-mof { fill: var(--motion); }

.bd-fig { fill: var(--fig); stroke: var(--fig-line); stroke-width: 1.5; }
.bd-hair { fill: var(--fig-hair); }
.bd-ln { stroke: var(--fig-hair); stroke-width: 2.2; }
.bd-eye { fill: var(--fig-hair); }
.bd-mv { stroke: var(--motion); stroke-width: 2.6; }
.bd-mh { fill: var(--motion); }
.bd-dot { fill: var(--brand); }
.bd-ring { fill: none; stroke: var(--brand); stroke-width: 2; opacity: 0.5; transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-in-out infinite; }
.bd-dot2 { fill: none; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 2 2.5; }
.bd-space { fill: color-mix(in srgb, var(--brand) 10%, transparent); stroke: var(--brand); stroke-width: 1.3; stroke-dasharray: 3 4; }
@keyframes ping { 50% { opacity: 0.12; transform: scale(1.35); } }

.sv {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 10px;
  width: 100%; max-width: 440px; padding: 12px; border-radius: var(--r-lg); background: var(--surface-2);
}
.sv-hands { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; }
.sv-hand { display: grid; justify-items: center; gap: 2px; padding: 6px 4px 5px; border-radius: var(--r-md); background: var(--stage); }
.sv-hand .hand { width: 64px; }
.sv-hand span { font: 500 0.62rem var(--f-gloss); letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--ink) 72%, var(--stage)); }
.sv-to { display: grid; color: var(--muted); }
.sv-body .body-map { display: block; width: 100%; max-width: 190px; margin-inline: auto; }
.sv-lg .sv-hand .hand { width: 82px; }
.sv-sm { max-width: 320px; padding: 10px; }
.sv-sm .sv-hand .hand { width: 46px; }
.sv-sm .sv-body .body-map { max-width: 130px; }

.params { display: grid; border-top: 1px solid var(--line); }
.params div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.params dt { font: 500 0.72rem/1.7 var(--f-gloss); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.params dd { margin: 0; font-size: 0.95rem; }
.how { font-size: 1.02rem; }
.tip { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--sun-soft); font-size: 0.95rem; }
.tip .ic { flex: none; margin-top: 2px; color: var(--sun); }
.example { display: grid; gap: 2px; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: var(--r-md); }
.example-k { font: 500 0.7rem var(--f-gloss); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.example .gloss { font-size: 1.05rem; color: var(--brand); }
.example-en { color: var(--muted); font-size: 0.92rem; }
.gloss-sub { color: var(--muted); font-size: 0.9rem; }
.cue-line { color: var(--muted); font-size: 0.92rem; text-align: center; }

/* ---------- Learn: welcome, today panel, path ---------- */
.welcome { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; padding: 22px; }
.welcome-art { display: grid; place-items: center; align-self: start; padding: 10px 8px 0; overflow: hidden; border-radius: 24px; background: var(--stage); }
.welcome-art .hand { width: 76px; }
.welcome h1 { font-size: clamp(1.45rem, 1.2rem + 1vw, 1.9rem); }
.welcome-copy { display: grid; gap: 14px; min-width: 0; }
.welcome-setup { display: grid; gap: 12px; }
.welcome-note { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 0.9rem; }
.welcome-note .ic { flex: none; margin-top: 3px; color: var(--bad); }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 12px; }
@media (max-width: 520px) {
  .welcome { grid-template-columns: minmax(0, 1fr); }
  .welcome-art { width: 84px; }
}

.today-inline { display: grid; gap: 14px; }
.today-inline .fact-card { display: none; }
.goal-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; }
.goal-ring { position: relative; display: grid; place-items: center; }
.goal-ring span { position: absolute; font: 500 0.7rem var(--f-gloss); }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--sun); transition: stroke-dashoffset 0.6s ease; }
.goal-big { font: 800 1.35rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.goal-big span { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.goal-streak { display: grid; justify-items: center; gap: 1px; line-height: 1; color: var(--muted); }
.goal-streak strong { font: 800 1.35rem var(--f-display); color: var(--ink); }
.goal-streak span { font-size: 0.7rem; }
.goal-streak.lit .ic { color: var(--flame); }
.wotd { display: grid; gap: 12px; }
.wotd-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.wotd-title h2 { font-size: 1.7rem; }
.wotd-title .gloss { font-size: 0.85rem; color: var(--muted); }
.wotd .sv { justify-self: center; }
.wotd-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.wotd-actions .btn { flex: 1 1 auto; }
.fact-card { display: grid; gap: 8px; }
.fact-q { font-weight: 600; }

.path { display: grid; gap: 36px; padding-block: 8px 24px; }
.unit { display: grid; gap: 30px; }
.unit-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  padding: 18px 20px; border-radius: var(--r-lg); background: var(--u); color: #FFFFFF;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--u) 68%, #000000);
}
.unit-copy { display: grid; gap: 4px; min-width: 0; }
.unit-head h2 { font-size: 1.4rem; }
.unit-head p { font-size: 0.92rem; color: rgb(255 255 255 / 0.88); }
.unit-head .unit-kicker { color: rgb(255 255 255 / 0.82); }
.unit-guide {
  display: inline-grid; justify-items: center; gap: 2px; flex: none; padding: 8px 10px;
  border: 2px solid rgb(255 255 255 / 0.4); border-radius: 12px; background: rgb(255 255 255 / 0.12); color: #FFFFFF;
  font: 500 0.7rem var(--f-gloss); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
}
.unit-guide:hover { background: rgb(255 255 255 / 0.22); }
.unit-guide:focus-visible { outline-color: #FFFFFF; }
.nodes { display: grid; justify-items: center; gap: 24px; margin: 0; padding: 0; list-style: none; --zig: 1; }
@media (max-width: 480px) { .nodes { --zig: 0.62; } }
.node-row { position: relative; display: grid; justify-items: center; transform: translateX(calc(var(--off) * var(--zig))); }
.node-row.open { z-index: 6; }
.node {
  position: relative; display: grid; place-items: center; width: 76px; height: 70px;
  border: 0; border-radius: 50%; background: var(--u); color: #FFFFFF; cursor: pointer;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--u) 64%, #000000);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--u) 64%, #000000); }
.node.is-done { background: var(--sun); color: #3D2B00; box-shadow: 0 7px 0 color-mix(in srgb, var(--sun) 62%, #000000); }
.node.is-locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 7px 0 var(--line); }
.node.is-next { box-shadow: 0 7px 0 color-mix(in srgb, var(--u) 64%, #000000), 0 0 0 7px color-mix(in srgb, var(--u) 22%, transparent); }
.node-check {
  position: absolute; top: -4px; right: -4px; display: grid; place-items: center; width: 26px; height: 26px;
  border: 3px solid var(--bg); border-radius: 50%; background: var(--good-btn); color: var(--good-btn-ink);
}
.node-start {
  position: absolute; bottom: calc(100% + 14px); left: 50%; translate: -50% 0; z-index: 2;
  padding: 7px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  font: 500 0.78rem var(--f-gloss); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
  animation: bob 1.6s ease-in-out infinite;
}
.node-start::after {
  content: ""; position: absolute; top: 100%; left: 50%; width: 12px; height: 12px;
  translate: -50% -5px; rotate: 45deg; background: var(--surface);
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line);
}
@keyframes bob { 50% { transform: translateY(-5px); } }
.node-pop {
  position: absolute; top: calc(100% + 16px); left: 50%; z-index: 5;
  translate: calc(-50% - var(--off) * var(--zig)) 0;
  display: grid; gap: 10px; width: min(300px, calc(100vw - 48px)); padding: 16px;
  border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow);
  text-align: left; animation: rise 0.18s ease-out;
  scroll-margin: 84px 0 104px;
}
.pop-signs { display: flex; flex-wrap: wrap; gap: 6px; }
.pop-lock { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.9rem; }
.path-end { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.guide-list { display: grid; gap: 10px; padding-left: 20px; }
@media (min-width: 1100px) { .page .today-inline { display: none; } }

/* ---------- Practice ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.mode {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 16px; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: var(--r-lg);
  background: var(--surface); color: var(--ink); text-align: left; cursor: pointer;
}
.mode:hover:not(:disabled) { border-color: color-mix(in srgb, var(--m) 60%, var(--line)); }
.mode:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.mode:disabled { opacity: 0.55; cursor: not-allowed; }
.mode-icon { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--m); color: #FFFFFF; }
.mode-a { --m: #2350E6; }
.mode-b { --m: #0B7F72; }
.mode-c { --m: #C9441C; }
.mode-d { --m: #6B45C8; }
.mode-e { --m: #C2306B; }
.mode-copy { display: grid; gap: 3px; }
.mode-copy strong { font: 750 1.08rem var(--f-display); }
.mode-copy span { font-size: 0.9rem; color: var(--muted); }
.mode-go { color: var(--muted); }

.spell-any { display: grid; gap: 12px; }
.spell-controls { display: flex; gap: 10px; }
.spell-controls input { flex: 1; min-width: 0; font-family: var(--f-gloss); letter-spacing: 0.1em; text-transform: uppercase; }
.spell-speed { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 0.9rem; }
.spell-speed input { flex: 1; min-width: 0; }
.spell-speed output { min-width: 72px; color: var(--muted); font: 500 0.8rem var(--f-gloss); text-align: right; }
.spell-big { display: grid; place-items: center; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.strip-cell { position: relative; display: grid; justify-items: center; gap: 4px; padding: 4px; border: 2px solid transparent; border-radius: 14px; }
.strip-cell.on { border-color: var(--brand); background: var(--brand-soft); }
.strip-l { font: 500 0.85rem var(--f-gloss); }
.strip-gap { width: 18px; }
.dbl-tag { position: absolute; top: -6px; right: -6px; padding: 2px 5px; border-radius: 6px; background: var(--sun-soft); color: var(--ink); font: 500 0.6rem var(--f-gloss); text-transform: uppercase; }
.stage.pop { animation: pop 0.22s ease-out; }
.stage.bounce { animation: hop 0.3s ease-out; }
@keyframes pop { from { transform: scale(0.88); opacity: 0.4; } }
@keyframes hop { 40% { transform: translateY(-12px); } }

/* ---------- Lesson player ---------- */
.player { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
.pl-top { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 820px; margin-inline: auto; padding: 14px 16px 8px; }
.pl-bar { flex: 1; height: 16px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
.pl-bar span {
  display: block; width: 0; height: 100%; border-radius: inherit; background: var(--good-strong);
  box-shadow: inset 0 4px 0 rgb(255 255 255 / 0.25);
  transition: width 0.4s cubic-bezier(0.3, 0.8, 0.3, 1);
}
.pl-combo { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--flame); font: 500 0.82rem var(--f-gloss); white-space: nowrap; }
.pl-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 32px; }
.pl-stage { max-width: 640px; margin-inline: auto; }
.pl-foot { padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--line); background: var(--surface); }
.pl-foot.good { border-color: transparent; background: var(--good-soft); }
.pl-foot.bad { border-color: transparent; background: var(--bad-soft); }
.pl-foot-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; max-width: 820px; margin-inline: auto; }
.pl-msg { display: grid; gap: 4px; flex: 1 1 260px; min-width: 0; }
.pl-msg:empty { display: none; }
.pl-actions { display: flex; flex: 1 0 auto; justify-content: flex-end; gap: 10px; }
.pl-actions .btn { flex: 1 1 auto; min-width: 150px; max-width: 280px; }
@media (max-width: 560px) {
  .pl-actions { width: 100%; }
  .pl-actions .btn { max-width: none; min-width: 0; }
}
.fb-title { display: flex; align-items: center; gap: 8px; font: 800 1.3rem var(--f-display); }
.good .fb-title { color: var(--good); }
.bad .fb-title { color: var(--bad); }
.fb-ans { font-weight: 600; }
.fb-note { font-size: 0.92rem; }
.fb-hand { display: inline-grid; width: 44px; padding: 2px; vertical-align: middle; border-radius: 10px; background: var(--stage); }
.fb-hand .hand { width: 100%; }

.ex { display: grid; gap: 16px; }
.ex > .stage, .ex > .sv, .ex .self-reveal > .sv { justify-self: center; }
.ex-q { font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.75rem); }
.ex-big { font-size: clamp(2.4rem, 2rem + 2vw, 3.2rem); font-weight: 800; }
.ex-intro .tip, .ex-intro .example { margin-top: 2px; }
.opts { display: grid; gap: 10px; }
.opts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts-pics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .opts-pics { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.opts-tf { grid-template-columns: 1fr 1fr; }
.opt {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 14px;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r-md);
  background: var(--surface); color: var(--ink); font: 600 1rem/1.35 var(--f-body); text-align: left; cursor: pointer;
  transition: transform 0.08s ease, background 0.15s, border-color 0.15s;
}
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.opt.is-right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); animation: shake 0.35s; }
.opt.is-done { opacity: 0.35; }
.opt:disabled { cursor: default; }
.opt kbd { display: grid; place-items: center; flex: none; min-width: 26px; height: 26px; border: 1.5px solid currentColor; border-radius: 8px; font: 500 0.78rem var(--f-gloss); opacity: 0.55; }
@media (pointer: coarse) { .opt kbd, .grade kbd { display: none; } }
.opt-pic { justify-content: center; padding: 10px; }
.opt-pic kbd { position: absolute; top: 8px; left: 8px; }
.opt-pic .stage { width: min(118px, 100%); }
.opts-tf .opt { justify-content: center; font-size: 1.1rem; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.match-col { display: grid; align-content: start; gap: 10px; }
.m-item { justify-content: center; min-height: 66px; text-align: center; }
.m-pic { padding: 4px; }
.m-pic .stage { width: 58px; }
.m-letter { font: 800 1.5rem var(--f-display); }
.match-words .m-item { font-size: 0.92rem; }

.reader { display: grid; justify-items: center; gap: 12px; }
.reader-stage { display: grid; place-items: center; min-height: 204px; }
.reader-dots { display: flex; gap: 6px; }
.reader-dots i { width: 10px; height: 10px; border: 2px solid var(--line); border-radius: 50%; background: var(--surface-2); }
.reader-dots i.on { border-color: var(--brand); background: var(--brand); }
.field input { font-family: var(--f-gloss); font-size: 1.3rem; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
.after:empty { display: none; }

.build-line, .gloss-line {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 80px; padding: 10px;
  border: 2px dashed var(--line); border-radius: var(--r-md); background: var(--surface);
}
.slot { width: 58px; height: 58px; border: 2px dashed var(--line); border-radius: 50%; }
.placed { padding: 0; border: 0; border-radius: 14px; background: none; cursor: pointer; }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tile-h { padding: 6px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; background: var(--surface); cursor: pointer; }
.tile-h:disabled { opacity: 0.25; cursor: default; }
.chip-t {
  display: inline-flex; align-items: center; padding: 10px 14px; border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 1rem; cursor: pointer;
}
.chip-t:disabled { opacity: 0.3; cursor: default; }
.placed .chip-t { border-color: var(--brand); color: var(--brand); }
.line-hint { color: var(--muted); font-size: 0.9rem; }
.en-line { font: 600 1.3rem/1.3 var(--f-display); }
.face-hint { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; }
.fact-text { font: 600 1.25rem/1.4 var(--f-display); }
.self-reveal { display: grid; gap: 12px; }

.done { display: grid; justify-items: center; gap: 14px; padding-top: 5vh; text-align: center; }
.done-hand { display: grid; place-items: center; width: 132px; aspect-ratio: 1; overflow: hidden; border-radius: 50%; background: var(--stage); animation: pop 0.5s ease-out; }
.done-hand .hand { width: 76%; }
.done h2 { font-size: clamp(2rem, 1.6rem + 2vw, 2.8rem); }
.done-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 460px; }
.done-tile { display: grid; overflow: hidden; border: 2px solid var(--t); border-radius: var(--r-md); background: var(--surface); }
.done-tile span { padding: 6px; background: var(--t); color: var(--t-ink); font: 500 0.7rem var(--f-gloss); letter-spacing: 0.06em; text-transform: uppercase; }
.done-tile strong { padding: 12px 6px; font: 800 1.5rem var(--f-display); font-variant-numeric: tabular-nums; }
.t-xp { --t: var(--sun); --t-ink: #3D2B00; }
.t-acc { --t: var(--good-btn); --t-ink: var(--good-btn-ink); }
.t-time { --t: var(--brand); --t-ink: var(--brand-ink); }
.done-streak { display: flex; align-items: center; gap: 6px; color: var(--flame); font-weight: 800; }

.tool .pl-top { justify-content: space-between; }
.tool-title { flex: 1; font-size: 1.2rem; text-align: center; }
.tool-side { display: flex; justify-content: flex-end; gap: 10px; min-width: 44px; }
.tool-score { display: inline-flex; align-items: center; gap: 4px; color: var(--good); font: 500 1rem var(--f-gloss); }
.tool-score.lit { color: var(--flame); }
.rd { display: grid; gap: 16px; }
.rd-settings { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 24px; }
.rd-settings .seg { justify-content: center; }
.rd-settings .seg legend { font: 500 0.72rem var(--f-gloss); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.rd-form { display: flex; gap: 10px; }
.rd-form input { flex: 1; min-width: 0; font-family: var(--f-gloss); font-size: 1.2rem; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
.rd-result { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); }
.rd-result:empty { display: none; }
.rd-result.good { background: var(--good-soft); }
.rd-result.bad { background: var(--bad-soft); }
.rd-result.good .fb-title { color: var(--good); }
.rd-result.bad .fb-title { color: var(--bad); }
.rd-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.lt { display: grid; gap: 16px; }
.lt-clock { height: 10px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
.lt-clock span { display: block; width: 100%; height: 100%; background: var(--flame); transition: width 0.1s linear; }
.lt-q { display: grid; gap: 14px; }
.lt-q > .stage, .lt-q > .sv { justify-self: center; }
.lt-intro { display: grid; justify-items: center; gap: 12px; max-width: 440px; margin-inline: auto; padding-top: 5vh; text-align: center; }
.lt-icon { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: var(--flame-soft); color: var(--flame); }
.lt-best { font: 700 1.1rem var(--f-display); }

/* ---------- Flashcards ---------- */
.fc-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.fc-counts { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 0.9rem; }
.fc-counts strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.fc-area { display: grid; justify-items: center; gap: 14px; }
.fc { width: 100%; max-width: 440px; perspective: 1200px; }
.fc-card {
  display: grid; align-content: center; min-height: 340px; padding: 20px;
  border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 24px;
  background: var(--surface); box-shadow: var(--shadow); cursor: pointer;
  transition: transform 0.16s ease-in;
}
.fc.turning .fc-card { transform: rotateY(90deg); }
.fc.is-flipped .fc-card { cursor: default; animation: unturn 0.18s ease-out; }
@keyframes unturn { from { transform: rotateY(-90deg); } }
.fc-face { display: grid; justify-items: center; gap: 14px; text-align: center; }
.fc-face .params { width: 100%; text-align: left; }
.fc-label { font: 800 clamp(2.6rem, 2rem + 3vw, 3.6rem)/1 var(--f-display); }
.fc-type { color: var(--muted); font: 500 0.72rem var(--f-gloss); letter-spacing: 0.1em; text-transform: uppercase; }
.fc-hint, .fc-left { color: var(--muted); font-size: 0.9rem; text-align: center; }
.fc-grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 520px; }
.fc-grades .btn-wide { grid-column: 1 / -1; justify-self: center; }
.grade {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 4px;
  border: 2px solid var(--g); border-bottom-width: 4px; border-radius: var(--r-md);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.grade strong { color: var(--g); font-weight: 800; }
.grade span { color: var(--muted); font: 500 0.74rem var(--f-gloss); }
.grade kbd { position: absolute; top: 4px; right: 6px; color: var(--muted); font: 500 0.62rem var(--f-gloss); }
.grade:active { transform: translateY(2px); }
.grade-again { --g: var(--bad); }
.grade-hard { --g: var(--flame); }
.grade-good { --g: var(--good); }
.grade-easy { --g: var(--brand); }
.fc-empty { display: grid; justify-items: center; gap: 12px; width: 100%; max-width: 460px; padding: 28px; text-align: center; }

/* ---------- Dictionary ---------- */
.dict-tools { display: grid; gap: 12px; }
.search { position: relative; }
.search .ic { position: absolute; top: 50%; left: 14px; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input { padding-left: 44px; }
.dict-count { color: var(--muted); font-size: 0.88rem; }
.dict-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.dict-card {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 6px; padding: 14px 10px 12px;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r-lg);
  background: var(--surface); color: var(--ink); text-align: center; cursor: pointer;
}
.dict-card:hover { border-color: color-mix(in srgb, var(--brand) 60%, var(--line)); }
.dc-label { font: 750 1.05rem var(--f-display); }
.dc-cue { color: var(--muted); font-size: 0.8rem; line-height: 1.3; }
.dc-badge { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--good-btn); color: var(--good-btn-ink); }
.empty { grid-column: 1 / -1; padding: 24px; border: 2px dashed var(--line); border-radius: var(--r-lg); color: var(--muted); text-align: center; }
.detail { display: grid; gap: 14px; }
.detail > .stage, .detail > .sv { justify-self: center; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Profile ---------- */
.profile-head { display: flex; align-items: center; gap: 18px; }
.profile-head > div:last-child { display: grid; gap: 4px; min-width: 0; }
.avatar { display: grid; place-items: center; flex: none; width: 92px; height: 92px; overflow: hidden; border: 3px solid var(--surface); border-radius: 50%; background: var(--stage); box-shadow: var(--shadow); }
.avatar .hand { width: 70%; margin-top: 12%; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.stat .ic { color: var(--sc); }
.stat strong { font: 800 1.6rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.88rem; font-weight: 600; }
.stat small { color: var(--muted); font-size: 0.78rem; }
.stat-flame { --sc: var(--flame); }
.stat-xp { --sc: var(--sun); }

.wk-goal { stroke: var(--sun); stroke-width: 1.5; stroke-dasharray: 4 4; }

.wk-bar { fill: color-mix(in srgb, var(--brand) 45%, var(--surface)); }
.wk-bar.met { fill: var(--brand); }
.wk-val { fill: var(--ink); font: 500 10px var(--f-gloss); }
.wk-day { fill: var(--muted); font: 500 10px var(--f-body); }
.wk-day.today { fill: var(--ink); font-weight: 700; }
.week figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 0.8rem; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

.lvl-2 { background: color-mix(in srgb, var(--good-strong) 62%, var(--surface-2)); }
.lvl-3 { background: var(--good-strong); }
.cal-cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-key { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 0.75rem; }
.cal-key .cal-cell { width: 14px; }
.badges-wrap { display: grid; gap: 12px; }
.badges-wrap h2 .muted { font: 500 0.8rem var(--f-gloss); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }

.badge.earned .badge-icon { background: var(--sun); color: #3D2B00; }
.badge-copy { display: grid; gap: 3px; }
.badge-copy strong { font: 750 1rem var(--f-display); }
.badge-copy > span { color: var(--muted); font-size: 0.84rem; }
.badge-copy > .badge-date { display: flex; align-items: center; gap: 4px; color: var(--good); font-weight: 600; }

.meter span { display: block; height: 100%; border-radius: inherit; background: var(--sun); }
.badge-copy > .badge-num { font: 500 0.72rem var(--f-gloss); }
.settings-form { display: grid; gap: 18px; margin-top: 14px; }
.card > h2 { display: flex; align-items: center; gap: 8px; }
.set-row { display: grid; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }

.set-row > legend { float: left; width: 100%; margin-bottom: 6px; }

.set-check label { display: grid; gap: 2px; cursor: pointer; }
.set-check label span { color: var(--muted); font-size: 0.86rem; }

.backup-box label, .restore-box label { font-weight: 700; font-size: 0.9rem; }
.backup-box .btn, .restore-box .btn { justify-self: start; }
.warn { margin-top: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.restore-msg { color: var(--bad); font-weight: 600; }
.about { display: grid; gap: 10px; }

/* ---------- Dialogs, toasts, confetti ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; padding: 16px; background: var(--scrim); }
@media (min-width: 640px) { .sheet-wrap { place-items: center; } }
.sheet {
  display: grid; gap: 14px; width: min(520px, 100%); max-height: min(88vh, 820px); overflow-y: auto;
  padding: 18px 18px 20px; border: 1px solid var(--line); border-radius: 22px;
  background: var(--surface); box-shadow: var(--shadow); animation: rise 0.22s ease-out;
}
.sheet-wide { width: min(620px, 100%); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 1.45rem; }
.sheet-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.toasts { position: fixed; top: calc(68px + env(safe-area-inset-top, 0px)); left: 50%; z-index: 80; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); translate: -50% 0; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: var(--shadow); animation: drop 0.25s ease-out; }
.toast .ic { flex: none; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: 0.3s; }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 90; width: 100%; height: 100%; pointer-events: none; }

/* ---------- Motion preferences ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }

    }
    function advance() {
      passed.add(current2._id);
      setProgress();
      show();

    function check() {
      if (phase !== "answer") return;
      const r = handler.check();
      resolve(r.correct, r);
    }
    function resolve(correct, { answer = "", note = "" } = {}) {
      if (phase !== "answer") return;
      phase = "feedback";
      if (!firstTry.has(current2._id)) firstTry.set(current2._id, correct);
      if (handler.graded !== false) recordAnswer(current2.sign, correct);
      if (correct) {
        passed.add(current2._id);
        combo++;
        vibrate(15);
      } else {
        combo = 0;
        queue.push(reshuffle(current2));
        vibrate([30, 60, 30]);
      }
      setProgress();
      comboEl.innerHTML = combo >= 3 ? `${icon("flame", 18)}<span>${combo} in a row</span>` : "";

      handler.reveal?.(correct);
      setButtons([{ label: "Continue", kind: correct ? "btn-good" : "btn-bad", onClick: show }]);
      actions.querySelector("button")?.focus({ preventScroll: true });
    }
    function finish() {
      phase = "done";
      const results = [...firstTry.values()];
      const right = results.filter(Boolean).length;
      const accuracy2 = results.length ? Math.round(right / results.length * 100) : 100;
      const perfect = results.length > 0 && right === results.length;
      const seconds = Math.round((Date.now() - started) / 1e3);
      const { xp = 0 } = onComplete?.({ accuracy: accuracy2, perfect, seconds }) || {};

      </div>

    </div>`;
      foot.className = "pl-foot";
      msg.innerHTML = "";
      setButtons([{ label: "Continue", onClick: close }]);

          ${learned[s.id] ? `<span class="dc-badge" title="In your flashcards">${icon("check", 14)}<span class="sr-only">Learned</span></span>` : ""}
        </button>`).join("") : `<div class="empty">No signs match \u201C${esc(filter.q)}\u201D. Try another word, or fingerspell it on the Practice tab.</div>`;
    };
    paint();
    page.querySelector("#dict-q").addEventListener("input", (e) => {
      filter.q = e.target.value;
      paint();
    });
    page.addEventListener("click", (e) => {
      const c2 = e.target.closest("[data-cat]");
      if (c2) {
        filter.cat = c2.dataset.cat;
        page.querySelectorAll("[data-cat]").forEach((b) => {
          b.classList.toggle("on", b === c2);
          b.setAttribute("aria-pressed", String(b === c2));
        });
        return paint();
      }
      const card = e.target.closest("[data-sign]");
      if (card) openSignDetail(card.dataset.sign, paint);
    });
  }

  // src/ui/theme.js
  var SKINS = {
    gold: { label: "Gold", hand: "#FFCF5A", hand2: "#F2B93B", line: "#8A5A0E", nail: "#FFF0C2" },
    light: { label: "Light", hand: "#F7D7BD", hand2: "#EDC4A3", line: "#9A6A50", nail: "#FDEDE2" },
    medlight: { label: "Medium light", hand: "#E3AE87", hand2: "#D59C74", line: "#86553A", nail: "#F6D6BF" },
    medium: { label: "Medium", hand: "#C68A5E", hand2: "#B67A50", line: "#673C22", nail: "#E6B996" },
    meddark: { label: "Medium dark", hand: "#9A6644", hand2: "#8A5838", line: "#4A2914", nail: "#C4946F" },
    dark: { label: "Dark", hand: "#6E4A33", hand2: "#5F3F2A", line: "#2A170B", nail: "#9C7559" }
  };
  var hostTheme = typeof document !== "undefined" ? document.documentElement.getAttribute("data-theme") : null;
  function applySettings(settings) {
    const root = document.documentElement;
    root.classList.toggle("flip", settings.hand === "left" !== settings.mirror);
    root.classList.toggle("reduce-motion", Boolean(settings.reduceMotion));
    const skin = SKINS[settings.skin] || SKINS.gold;
    root.style.setProperty("--hand", skin.hand);
    root.style.setProperty("--hand-2", skin.hand2);
    root.style.setProperty("--hand-line", skin.line);
    root.style.setProperty("--hand-nail", skin.nail);
    if (settings.theme === "light" || settings.theme === "dark") root.setAttribute("data-theme", settings.theme);
    else if (hostTheme) root.setAttribute("data-theme", hostTheme);
    else root.removeAttribute("data-theme");
  }

  // src/views/profile.js
  var GOALS = [[10, "Casual"], [20, "Regular"], [30, "Serious"], [50, "Intense"]];
  function weekChart(state) {
    const day = today();
    const days = Array.from({ length: 7 }, (_, i) => addDays(day, i - 6));
    const values = days.map((d) => state.xpByDate[d] || 0);
    const goal = state.settings.goal;
    const max = Math.max(goal, ...values) * 1.18;
    const top = 18;
    const bottom = 118;
    const y = (v) => bottom - v / max * (bottom - top);
    const step = 284 / 7;
    const bars = days.map((d, i) => {
      const v = values[i];
      const x = 30 + i * step + step / 2;
      const h = Math.max(v ? 3 : 0, bottom - y(v));
      const met = v >= goal;
      const name = fromKey(d).toLocaleDateString(void 0, { weekday: "short" });
      return `<g>
      <rect class="wk-bar ${met ? "met" : ""} ${d === day ? "today" : ""}" x="${(x - 13).toFixed(1)}" y="${(bottom - h).toFixed(1)}" width="26" height="${h.toFixed(1)}" rx="6"/>
      ${v ? `<text class="wk-val" x="${x.toFixed(1)}" y="${(bottom - h - 5).toFixed(1)}" text-anchor="middle">${v}</text>` : ""}
      <text class="wk-day ${d === day ? "today" : ""}" x="${x.toFixed(1)}" y="138" text-anchor="middle">${esc(name)}</text>
    </g>`;
    }).join("");
    const gy = y(goal).toFixed(1);
    const total = values.reduce((a, b) => a + b, 0);
    return `<figure class="week">
    <svg viewBox="0 0 320 146" role="img" aria-label="XP earned each day this week, ${total} in total, daily goal ${goal}">
      <line class="wk-axis" x1="30" y1="${bottom}" x2="314" y2="${bottom}"/>
      <line class="wk-goal" x1="30" y1="${gy}" x2="314" y2="${gy}"/>
      <text class="wk-goal-l" x="2" y="${(Number(gy) + 4).toFixed(1)}">${goal}</text>
      ${bars}
    </svg>
    <figcaption><span class="key key-bar"></span>XP per day <span class="key key-goal"></span>Daily goal \xB7 <strong>${total} XP</strong> this week</figcaption>
  </figure>`;
  }
  function calendar(state) {
    const day = today();
    const start2 = addDays(day, -27);
    const goal = state.settings.goal;
    const cells = Array.from({ length: 28 }, (_, i) => {
      const d = addDays(start2, i);
      const v = state.xpByDate[d] || 0;
      const lvl = !v ? 0 : v < goal / 2 ? 1 : v < goal ? 2 : 3;
      const label = `${niceDate(d, { weekday: "short", month: "short", day: "numeric" })}: ${v} XP`;
      return `<span class="cal-cell lvl-${lvl}${d === day ? " today" : ""}" title="${esc(label)}" role="img" aria-label="${esc(label)}"></span>`;
    }).join("");
    const heads = Array.from({ length: 7 }, (_, i) => `<span class="cal-head">${esc(fromKey(addDays(start2, i)).toLocaleDateString(void 0, { weekday: "narrow" }))}</span>`).join("");
    return `<div class="cal">${heads}${cells}</div>
    <p class="cal-key"><span>Less</span>${[0, 1, 2, 3].map((l) => `<span class="cal-cell lvl-${l}"></span>`).join("")}<span>Goal met</span></p>`;
  }
  function badge(a, state) {
    const [cur, goal] = progressOf(a, state);
    const earned = state.achievements[a.id];
    return `<div class="badge ${earned ? "earned" : ""}">
    <span class="badge-icon">${icon(a.icon === "abc" ? "abc" : a.icon, 24)}</span>
    <div class="badge-copy">
      <strong>${esc(a.title)}</strong>
      <span>${esc(a.desc)}</span>
      ${earned ? `<span class="badge-date">${icon("check", 14)}Earned ${esc(niceDate(earned))}</span>` : `<span class="meter" role="progressbar" aria-label="${esc(a.title)} progress" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${cur}"><span style="width:${Math.round(cur / goal * 100)}%"></span></span><span class="badge-num">${fmtNumber(cur)} / ${fmtNumber(goal)}</span>`}
    </div>
  </div>`;
  }
  function settingsForm(st) {
    const radio = (name, value, label, checked, extra = "") => `<input type="radio" name="${name}" id="${name}-${value}" value="${value}" ${checked ? "checked" : ""}><label for="${name}-${value}" ${extra}>${label}</label>`;
    const check = (id, on, title, text) => `<div class="set-check"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><label for="${id}"><strong>${title}</strong><span>${text}</span></label></div>`;
    return `<form class="settings-form" novalidate>
    <div class="set-row"><label for="set-name">Your name</label><input id="set-name" type="text" maxlength="24" autocomplete="nickname" value="${esc(store.state.profile.name)}" placeholder="Optional"></div>
    <div class="set-row"><label for="set-goal">Daily goal</label><select id="set-goal">${GOALS.map(([g, n]) => `<option value="${g}" ${st.goal === g ? "selected" : ""}>${n}: ${g} XP a day</option>`).join("")}</select></div>
    <fieldset class="set-row"><legend>I sign with my</legend><div class="seg seg-sm">${radio("set-hand", "right", "Right hand", st.hand === "right")}${radio("set-hand", "left", "Left hand", st.hand === "left")}</div></fieldset>
    ${check("set-mirror", st.mirror, "Mirror the drawings", "Show each hand as if it were your own, instead of a signer facing you.")}
    <fieldset class="set-row"><legend>Hand color</legend><div class="swatches">${Object.entries(SKINS).map(([id, s]) => radio("set-skin", id, `<span class="sr-only">${s.label}</span>`, st.skin === id, `class="swatch" style="--sw:${s.hand};--sw-line:${s.line}" title="${s.label}"`)).join("")}</div></fieldset>
    <fieldset class="set-row"><legend>Theme</legend><div class="seg seg-sm">${radio("set-theme", "system", "System", st.theme === "system")}${radio("set-theme", "light", "Light", st.theme === "light")}${radio("set-theme", "dark", "Dark", st.theme === "dark")}</div></fieldset>
    ${check("set-motion", st.reduceMotion, "Reduce motion", "Turn off confetti and animations.")}
    ${check("set-haptics", st.haptics, "Vibration", "Buzz on right and wrong answers, on phones that support it.")}
    ${check("set-unlock", st.unlockAll, "Open every lesson", "Skip ahead on the path without finishing earlier lessons.")}
  </form>`;
  }
  function renderProfile(page, ctx) {
    const s = store.state;
    const st = s.settings;
    const name = s.profile.name.trim();
    const first = name.toUpperCase().match(/[A-Z]/)?.[0];
    const streak = streakNow();
    page.innerHTML = `
    <header class="profile-head">
      <div class="avatar" aria-hidden="true">${handSVG(first || "ILY")}</div>
      <div>
        <h1>${esc(name || "Your profile")}</h1>
        <p class="muted">${s.profile.since ? `Learning ASL since ${esc(niceDate(s.profile.since, { month: "long", day: "numeric", year: "numeric" }))}` : "Your stats start with your first lesson."}</p>
        ${first ? `<p class="fine">Your avatar is the letter ${first} in fingerspelling.</p>` : ""}
      </div>
    </header>

    <section class="stats" aria-label="Your stats">
      <div class="stat stat-flame">${icon("flame", 22)}<strong>${streak}</strong><span>Day streak</span><small>Best ${s.streak.best}</small></div>
      <div class="stat stat-xp">${icon("bolt", 22)}<strong>${fmtNumber(s.xp)}</strong><span>Total XP</span><small>${fmtNumber(s.xpByDate[today()] || 0)} today</small></div>
      <div class="stat stat-signs">${icon("book", 22)}<strong>${learnedIds().length}</strong><span>Signs learned</span><small>of ${SIGNS.length}</small></div>
      <div class="stat stat-lessons">${icon("star", 22)}<strong>${lessonsDone2()}</strong><span>Lessons done</span><small>of ${LESSONS.length}</small></div>
      <div class="stat stat-acc">${icon("target", 22)}<strong>${accuracy()}%</strong><span>Accuracy</span><small>${fmtNumber(s.stats.answered)} answers</small></div>
    </section>

    <div class="profile-grid">
      <section class="card"><h2>This week</h2>${weekChart(s)}</section>
      <section class="card"><h2>Last four weeks</h2>${calendar(s)}</section>
    </div>

    <section class="badges-wrap" aria-labelledby="badges-h">
      <h2 id="badges-h">Badges <span class="muted">${Object.keys(s.achievements).length} of ${ACHIEVEMENTS.length}</span></h2>
      <div class="badges">${ACHIEVEMENTS.map((a) => badge(a, s)).join("")}</div>
    </section>

    <section class="card" aria-labelledby="settings-h">
      <h2 id="settings-h">${icon("sliders", 20)} Settings</h2>
      ${settingsForm(st)}
    </section>

    <section class="card" aria-labelledby="backup-h">
      <h2 id="backup-h">Backup and reset</h2>
      <p class="muted">Your progress is saved in this browser only. Copy a backup code to move it to another device.</p>
      ${store.canSave ? "" : '<p class="warn">This browser is blocking saved data, so progress resets when you close the page. Copy a backup code to keep it.</p>'}
      <div class="row">
        <button type="button" class="btn btn-quiet btn-sm" data-backup>${icon("copy", 18)}Show backup code</button>
        <button type="button" class="btn btn-quiet btn-sm" data-restore>${icon("replay", 18)}Restore from a code</button>
        <button type="button" class="btn btn-bad btn-sm" data-reset>Reset progress</button>
      </div>
      <div class="backup-box" hidden>
        <label for="backup-text">Backup code</label>
        <textarea id="backup-text" rows="4" readonly></textarea>
        <button type="button" class="btn btn-sm" data-copy>${icon("copy", 18)}Copy code</button>
      </div>
      <div class="restore-box" hidden>
        <label for="restore-text">Paste a backup code</label>
        <textarea id="restore-text" rows="4" spellcheck="false"></textarea>
        <button type="button" class="btn btn-sm" data-restore-go>Restore progress</button>
        <p class="restore-msg" aria-live="polite"></p>
      </div>
    </section>

    <section class="card about" aria-labelledby="about-h">
      <h2 id="about-h">About SignSpark</h2>
      <p>SignSpark teaches beginner American Sign Language: the alphabet, numbers 0 to 10, and ${SIGNS.length - 37} everyday signs, with lessons on word order and Deaf culture. Every hand drawing is generated by code from a small recipe, so the app has no image files.</p>
      <p>Signs vary by region and community, and nothing replaces learning from Deaf signers. Support Deaf-led organizations like the <a href="https://www.nad.org/" target="_blank" rel="noopener noreferrer">National Association of the Deaf</a>.</p>
    </section>`;
    const form = page.querySelector(".settings-form");
    form.addEventListener("submit", (e) => e.preventDefault());
    form.addEventListener("change", (e) => {
      const t2 = e.target;
      store.update((state) => {
        const set = state.settings;
        if (t2.id === "set-name") state.profile.name = t2.value.trim().slice(0, 24);
        if (t2.id === "set-goal") set.goal = Number(t2.value);
        if (t2.name === "set-hand") set.hand = t2.value;
        if (t2.id === "set-mirror") set.mirror = t2.checked;
        if (t2.name === "set-skin") set.skin = t2.value;
        if (t2.name === "set-theme") set.theme = t2.value;
        if (t2.id === "set-motion") set.reduceMotion = t2.checked;
        if (t2.id === "set-haptics") set.haptics = t2.checked;
        if (t2.id === "set-unlock") set.unlockAll = t2.checked;
      });
      if (t2.id === "set-name") {
        ctx.refresh();
        toast("Name saved");
      }
    });
    const backupBox = page.querySelector(".backup-box");
    const restoreBox = page.querySelector(".restore-box");
    page.addEventListener("click", async (e) => {
      if (e.target.closest("[data-backup]")) {
        backupBox.hidden = false;
        restoreBox.hidden = true;
        const ta = page.querySelector("#backup-text");
        ta.value = JSON.stringify(store.state);
        ta.focus();
        ta.select();
      }
      if (e.target.closest("[data-copy]")) {
        const ok = await copyText(page.querySelector("#backup-text").value, page.querySelector("#backup-text"));
        toast(ok ? "Backup code copied" : "Code selected. Copy it with Ctrl+C or Cmd+C.");
      }
      if (e.target.closest("[data-restore]")) {
        restoreBox.hidden = false;
        backupBox.hidden = true;
        page.querySelector("#restore-text").focus();
      }
      if (e.target.closest("[data-restore-go]")) {
        const msg = page.querySelector(".restore-msg");
        try {
          const next = parseState(page.querySelector("#restore-text").value.trim());
          store.replace(next);
          checkAchievements();
          toast("Progress restored", { icon: "check" });
          ctx.refresh();
        } catch (err) {
          msg.textContent = `That code did not work. ${err.message.includes("SignSpark") ? err.message : "Paste the whole backup code and try again."}`;
        }
      }
      if (e.target.closest("[data-reset]")) {
        openSheet({
          title: "Reset all progress?",
          body: "<p>This erases your XP, streak, lessons, flashcards and badges on this device. Your settings stay. This cannot be undone unless you have a backup code.</p>",
          actions: [
            { label: "Cancel", kind: "btn-quiet" },
            {
              label: "Reset progress",
              kind: "btn-bad",
              onClick: () => {
                const fresh = defaultState();
                fresh.settings = { ...store.state.settings };
                fresh.profile = { ...fresh.profile, name: store.state.profile.name, welcomed: true };
                store.replace(fresh);
                toast("Progress reset");
                ctx.refresh();
              }
            }
          ]
        });
      }
    });
  }

  // src/main.js
  var ROUTES = {
    learn: { label: "Learn", icon: "learn", render: renderLearn },
    practice: { label: "Practice", icon: "practice", render: renderPractice },
    cards: { label: "Flashcards", icon: "cards", render: renderCards },
    dictionary: { label: "Dictionary", icon: "book", render: renderDictionary },
    profile: { label: "Profile", icon: "user", render: renderProfile }
  };
  var current = null;
  var visits = 0;
  var routeFromHash = () => {
    const h = (location.hash || "").replace(/^#/, "");
    return ROUTES[h] ? h : null;
  };
  function navLinks(kind) {
    return Object.entries(ROUTES).map(([id, r]) => `<a class="${kind}-link" href="#${id}" data-route="${id}">${icon(r.icon, kind === "tab" ? 24 : 26)}<span>${r.label}</span></a>`).join("");
  }
  function shell(app) {
    app.innerHTML = `
    <button type="button" class="skip" data-skip>Skip to content</button>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#learn" data-route="learn" aria-label="SignSpark home"><span class="brand-mark">${handSVG("ILY")}</span><span class="brand-name">SignSpark</span></a>
        <nav class="side-nav" aria-label="Main">${navLinks("side")}</nav>
      </aside>
      <header class="topbar">
        <a class="brand" href="#learn" data-route="learn" aria-label="SignSpark home"><span class="brand-mark">${handSVG("ILY")}</span><span class="brand-name">SignSpark</span></a>
        <div class="top-stats"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <aside class="rail" aria-label="Today"></aside>
    </div>
    <nav class="tabbar" aria-label="Main">${navLinks("tab")}</nav>`;
    app.addEventListener("click", (e) => {
      const link = e.target.closest("[data-route]");
      if (link && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        go(link.dataset.route);
      }
      if (e.target.closest("[data-skip]")) document.getElementById("view").focus();
    });
    bindToday(app.querySelector(".rail"), () => refresh());
  }
  function topStats() {
    const streak = streakNow();
    const xp = xpToday();
    const goal = store.state.settings.goal;
    return `
    <span class="pill pill-flame ${streak ? "lit" : ""}" title="Day streak">${icon("flame", 20)}<strong>${streak}</strong><span class="sr-only">day streak</span></span>
    <span class="pill pill-xp" title="Total XP">${icon("bolt", 20)}<strong>${store.state.xp}</strong><span class="sr-only">total XP</span></span>
    <span class="pill pill-goal" title="Daily goal: ${xp} of ${goal} XP">${goalRing(xp, goal, 30)}<span class="sr-only">Daily goal ${xp} of ${goal} XP</span></span>`;
  }
  function paintChrome() {
    document.querySelector(".top-stats").innerHTML = topStats();
    document.querySelector(".rail").innerHTML = todayPanel();
    document.querySelectorAll("[data-route]").forEach((a) => {
      if (a.classList.contains("brand")) return;
      if (a.dataset.route === current) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }
  function render(name, { keepScroll = false } = {}) {
    stopPractice();
    const y = window.scrollY;
    current = name;
    visits++;
    const view = document.getElementById("view");
    const page = document.createElement("div");
    page.className = `page page-${name}`;
    view.replaceChildren(page);
    ROUTES[name].render(page, { refresh, go, firstVisit: visits === 1 });
    paintChrome();
    document.title = name === "learn" ? "SignSpark" : `${ROUTES[name].label} \xB7 SignSpark`;
    if (keepScroll) window.scrollTo(0, y);
    else if (visits > 1) window.scrollTo(0, 0);
  }
  function go(name) {
    if (!ROUTES[name]) name = "learn";
    try {
      if (location.hash !== `#${name}`) history.pushState(null, "", `#${name}`);
    } catch {
    }
    render(name);
    document.getElementById("view").focus({ preventScroll: true });
  }
  function refresh() {
    render(current, { keepScroll: true });
  }
  function start() {
    const app = document.getElementById("app");
    shell(app);
    applySettings(store.state.settings);
    store.subscribe((state) => {
      applySettings(state.settings);
      if (current) paintChrome();
    });
    onProgress((type, data) => {
      if (type === "achievement") toast(`Badge earned: ${data.title}`, { icon: "trophy", tone: "win", ms: 4200 });
      if (type === "goal") toast(`Daily goal reached: ${data.goal} XP!`, { icon: "target", tone: "win", ms: 4200 });
    });
    window.addEventListener("popstate", () => {
      const r = routeFromHash() || "learn";
      if (r !== current) render(r);
    });
    document.addEventListener("keydown", (e) => {
      if (current === "cards" && !document.querySelector(".player, .sheet-wrap")) cardsKey(e);
    });
    render(routeFromHash() || "learn");
  }
  start();
})();

</script>
</body>
</html>
